name: Windows x64 Release

on:
  push:
    branches:
      - main # 首次注册工作流并验证 Windows 构建，验证后移除此入口。
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows 10 x64 绿色版
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 安装 Liberica JDK 17 Full x64
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: liberica
          java-version: '17.0.20+10'
          java-package: jdk+fx
          architecture: x64
          cache: maven
      - name: 测试并生成 EXE 及内置运行时
        run: ./scripts/package-windows.ps1 -JdkHome $env:JAVA_HOME
      - name: 验证打包后的 EXE 能打开窗口
        run: |
          $appDir = Join-Path $PWD 'target/package-image/欢欢'
          $process = Start-Process -FilePath (Join-Path $appDir '欢欢.exe') -ArgumentList '--l4j-debug' -WorkingDirectory $appDir -PassThru
          $children = @()
          try {
            $opened = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "EXE 提前退出，退出码：$($process.ExitCode)" }
              # Launch4j 使用子进程 javaw.exe 承载 JavaFX 窗口。
              $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($process.Id)" |
                ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue })
              if (@(@($process) + $children | Where-Object { $_.MainWindowTitle -eq '欢欢' }).Count -gt 0) {
                $opened = $true
                break
              }
            }
            if (-not $opened) { throw 'EXE 未在 30 秒内打开欢欢主窗口。' }
          } finally {
            @($process) + $children | Select-Object Id, ProcessName, MainWindowTitle | Format-Table
            $debugLog = Join-Path $appDir 'launch4j.log'
            if (Test-Path -LiteralPath $debugLog) { Get-Content -LiteralPath $debugLog }
            $children | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: 整理发布文件及 SHA-256
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*-windows-x64.zip')
          if ($archives.Count -ne 1) { throw '必须恰好生成一个 Windows 压缩包。' }
          $archive = 'dist/huanhuan-win10-x64.zip'
          Move-Item -LiteralPath $archives[0].FullName -Destination $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  huanhuan-win10-x64.zip" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huanhuan-win10-x64
          path: |
            dist/huanhuan-win10-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布标签对应的 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: huanhuan-win10-x64
          path: dist
      - name: 创建 Release 并上传绿色版
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Windows 10 x64 绿色版：下载 huanhuan-win10-x64.zip，完整解压后双击“欢欢/欢欢.exe”。

          已内置 Java 运行时，无需另装 Java。请保留 EXE 旁的 app 和 runtime 文件夹。

          入院、出院间隔以小时输出，严格大于 24 小时为不合格，恰好 24 小时合格。
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/huanhuan-win10-x64.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/huanhuan-win10-x64.zip dist/SHA256SUMS.txt \
              --verify-tag --title "欢欢 $RELEASE_TAG" --notes-file release-notes.md
          fi
